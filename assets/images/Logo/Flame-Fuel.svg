  />

  <!-- Inner core flame (hot bright amber-yellow) -->
  <path
    d="M 32 29 
       C 32 29, 36 34, 36 37 
       C 36 41, 33 44, 31 44 
       C 28 44, 25 41, 25 38 
       C 25 34, 29 32, 32 29 Z"
