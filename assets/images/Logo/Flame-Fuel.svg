  <!-- Subtle warm fire glow behind flame -->
  <circle cx="32" cy="34" r="18" fill="#f45b25" opacity="0.25" filter="blur(4px)" />

  <!-- Iconic Flame Logo -->
  <path
    d="M 33 13 
       C 33 13, 39 21, 39 26 
       C 39 28, 38 31, 36.5 32.5 
       C 40 31, 46 29, 46 36 
       C 46 44, 40 49, 32 49 
       C 24 49, 18 43, 18 35 
       C 18 27, 24 21, 28 17 
       C 28 21, 29 25, 31 27 
       C 31 22, 33 13, 33 13 Z"
